<!DOCTYPE html>
<html>
<head>
    <title>Smart Ferti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🌱 Smart Ferti</h1>
<p>Smart Fertilizer Recommendation System</p>
<p>స్మార్ట్ ఎరువుల సిఫార్సు వ్యవస్థ</p>
    <h2>Fertilizer Recommendation System</h2>

    <p>Get suitable fertilizer recommendations
    for your crops.</p>

    <label>Enter Crop Name:</label>
    <select id="crop">
    <option value="">Select Crop</option>
    <option value="Rice">Rice</option>
    <option value="Maize">Maize</option>
    <option value="Groundnut">Groundnut</option>
    <option value="Cotton">Cotton</option>
    <option value="Chilli">Chilli</option>
    <option value="Tomato">Tomato</option>
</select>

    <label>Nitrogen (N):</label>
    <input type="number" id="nitrogen">

    <label>Phosphorus (P):</label>
    <input type="number" id="phosphorus">

    <label>Potassium (K):</label>
    <input type="number" id="potassium">

    <label>Soil pH:</label>
    <input type="number" id="ph" step="0.1">
    <label>Enter Your Location:</label>
<input type="text" id="location" placeholder="Example: Guntur">

    <button onclick="recommend()">Get Recommendation</button>

    <div id="result" class="result-box">
    <h2>🌱 Soil Health Dashboard</h2>
    <p>Your soil analysis will appear here.</p>
</div>

    <script src="script.js"></script>
</body>
</html>
